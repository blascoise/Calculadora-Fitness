<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1E5B4A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macros">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx. 560px), cabecera fija arriba, pestañas abajo, hojas que suben desde abajo */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E2E8E4; --ink:#16201B; --muted:#5A6960; --line:#D2DBD5;
  --accent:#1E5B4A; --accent-ink:#FFFFFF; --accent-soft:#D3E7DE;
  --prot:#A3304F; --carb:#AE740C; --fat:#5C761A; --warn:#B4441C;
  --display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#18201C; --surface-2:#232C28; --ink:#E5EDE8; --muted:#97A69D; --line:#2D3833;
  --accent:#5FC1A0; --accent-ink:#0B1612; --accent-soft:#1E3A30;
  --prot:#E37A96; --carb:#E3AD45; --fat:#AAC455; --warn:#F08A5D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#18201C; --surface-2:#232C28; --ink:#E5EDE8; --muted:#97A69D; --line:#2D3833;
  --accent:#5FC1A0; --accent-ink:#0B1612; --accent-soft:#1E3A30;
  --prot:#E37A96; --carb:#E3AD45; --fat:#AAC455; --warn:#F08A5D; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
.who{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px 4px 0;font-weight:600}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);font-size:18px}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{border:0;background:var(--surface);width:36px;height:36px;border-radius:10px;font-size:18px;line-height:1}
.datenav .dl{min-width:92px;text-align:center;font-weight:600;background:none;width:auto;padding:0 6px;font-size:15px}
section.tab{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.card{background:var(--surface);border-radius:16px;padding:16px}
.sum .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1}
.big.over{color:var(--warn)}
.lbl{color:var(--muted);font-size:.85rem;margin-top:4px}
.sub{color:var(--muted);font-size:.9rem;text-align:right}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .25s}
.bar.over i{background:var(--warn)}
.sum > .bar{margin-top:12px;height:10px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.m .ml{display:flex;flex-direction:column;font-size:.8rem;margin-bottom:6px}
.m .ml b{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;color:var(--muted)}
.m .ml span{font-weight:600;font-size:.95rem}
.m.prot .bar i{background:var(--prot)} .m.carb .bar i{background:var(--carb)} .m.fat .bar i{background:var(--fat)}
.m .bar.over i{background:var(--warn)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden}
.entry,.food{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0;cursor:pointer}
.list > :last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.ename,.fname{font-weight:600;overflow-wrap:anywhere}
.emeta,.fmeta{color:var(--muted);font-size:.82rem}
.ekcal{font-family:var(--display);font-weight:700;font-size:1.15rem;text-align:right;white-space:nowrap}
.ekcal small{display:block;font-family:var(--body);font-weight:500;font-size:.7rem;color:var(--muted)}
.badge{display:inline-block;font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:2px;margin-left:4px;white-space:nowrap}
.badge.est{background:var(--surface-2);color:var(--muted)}
.qadd{flex:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:10px;padding:9px 11px;font-size:.85rem;white-space:nowrap}
.empty{padding:18px 14px;color:var(--muted);font-size:.92rem;background:var(--surface);border-radius:16px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--surface);}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.btn.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:.88rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.combo-chip{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.combo-chip small{opacity:.8;font-weight:500;margin-left:4px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.note{color:var(--muted);font-size:.82rem}
.hint{font-size:.82rem;color:var(--muted)}
.hint.bad{color:var(--warn)}
/* pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 11px;font-weight:600;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* hoja inferior */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .bd{position:absolute;inset:0;background:rgb(0 0 0 / .45)}
.sheet .panel{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.panel .phead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.panel .x{border:0;background:var(--surface-2);border-radius:50%;width:32px;height:32px;flex:none;font-size:16px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.qgrid button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:14px 6px;font-weight:700;font-size:1rem}
.now{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.9rem}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:0;background:var(--surface-2);font-size:22px;font-weight:600}
.stepper input{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:700;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px}
.citem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.citem input{width:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-size:16px;text-align:right}
.citem .rm{border:0;background:none;color:var(--muted);font-size:20px;width:32px}
.results{display:flex;flex-direction:column;gap:4px}
.results button{border:0;background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;gap:8px}
/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);font-size:.9rem;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
#toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:4px 6px}
/* selector de perfil */
#picker{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#picker h1{font-size:1.8rem;text-align:center}
.ptiles{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.ptile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:1rem}
.ptile .pav{width:96px;height:96px;border-radius:24px;background:var(--surface);display:grid;place-items:center;font-size:48px;border:2px solid transparent}
.ptile:hover .pav,.ptile:focus-visible .pav{border-color:var(--accent)}
.ptile.add .pav{font-size:34px;color:var(--muted);border:2px dashed var(--line)}
/* semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;position:relative;margin-top:10px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.week .bw{height:100px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.week .b{width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--accent)}
.week .b.over{background:var(--warn)}
.week .b.zero{background:var(--surface-2);height:3px!important}
.week .d{font-size:.7rem;line-height:14px;color:var(--muted);font-weight:600}
.week .tl{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6;pointer-events:none}
.calcout{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.calcout .kc{font-family:var(--display);font-weight:700;font-size:1.6rem}
textarea.json{width:100%;min-height:110px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">

</div>

<nav class="tabs"><div class="in">

</div></nav>

<div class="sheet" id="sheet" hidden><div class="bd" data-act="close"></div><div class="panel" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<div id="picker" hidden></div>

/* =====================================================================
   CAPA DE DATOS
   La app solo usa all / upsert / remove / day. Cambiar de localStorage a Supabase
   es rellenar CONFIG arriba; las tablas están en supabase.sql.
   ===================================================================== */
const LS = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const LocalAdapter = {
  name:'local',
  async all(t){ return LS.get('cm_'+t); },
  async upsert(t, rows){ if(!rows.length) return; const all = LS.get('cm_'+t) || []; for(const r of rows){ const i = all.findIndex(x=>x.id===r.id); if(i>=0) all[i]=r; else all.push(r); } LS.set('cm_'+t, all); },
  async remove(t, ids){ if(!ids.length) return; LS.set('cm_'+t, (LS.get('cm_'+t)||[]).filter(x=>!ids.includes(x.id))); },
  async day(){ return []; }
};
function SupabaseAdapter(url, key){
  const base = url.replace(/\/+$/,'') + '/rest/v1/';
  const headers = {apikey:key, 'Content-Type':'application/json'};
  if(!key.startsWith('sb_')) headers.Authorization = 'Bearer ' + key;
  async function req(path, opt={}){
    const r = await fetch(base+path, {...opt, headers:{...headers, ...(opt.headers||{})}});
    if(!r.ok) throw new Error('Supabase '+r.status+': '+(await r.text()));
    const txt = await r.text(); return txt ? JSON.parse(txt) : null;
  }
  return {
    name:'supabase',
    since: daysAgo(150),
    async all(t){ let q = t+'?select=*'; if(t==='entries') q += '&date=gte.'+this.since; return req(q); },
    async upsert(t, rows){ if(!rows.length) return; await req(t, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(rows)}); },
    async remove(t, ids){ if(!ids.length) return; await req(t+'?id=in.('+ids.map(i=>'"'+encodeURIComponent(i)+'"').join(',')+')', {method:'DELETE'}); },
    async day(profile, date){ if(date >= this.since) return []; return req('entries?select=*&profile=eq.'+encodeURIComponent(profile)+'&date=eq.'+date); }
  };
}
function SheetsAdapter(url){
  let cache = null;
  async function post(body){
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
    const j = await r.json(); if(!j.ok) throw new Error(j.error || 'Error en Google Sheets'); return j;
  }
  return {
    name:'sheets',
    async all(t){
      if(!cache){ const r = await fetch(url + '?action=all'); cache = await r.json(); if(!cache.ok) throw new Error(cache.error || 'Error en Google Sheets'); }
      return cache[t];
    },
    async upsert(t, rows){ if(rows.length) await post({action:'upsert', table:t, rows}); },
    async remove(t, ids){ if(ids.length) await post({action:'remove', table:t, ids}); },
    async day(){ return []; }
  };
}
const DB = {
  adapter: null,
  async load(){
    this.adapter = CONFIG.SHEETS_URL ? SheetsAdapter(CONFIG.SHEETS_URL)
      : (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY) ? SupabaseAdapter(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY) : LocalAdapter;
    const d = {};
    for(const t of ['profiles','foods','entries','combos']) d[t] = await this.adapter.all(t);
    if(!d.profiles || !d.profiles.length){
      d.profiles = SEED_PROFILES; d.foods = SEED_FOODS; d.combos = SEED_COMBOS; d.entries = d.entries || [];
      for(const t of ['profiles','foods','combos']) await this.adapter.upsert(t, d[t]);
    }
    return d;
  },
  save(t, rows){ persist(this.adapter.upsert(t, [].concat(rows))); },
  del(t, ids){ persist(this.adapter.remove(t, [].concat(ids))); }
};
function persist(p){ p.catch(err=>{ console.error(err); toast('No se ha podido guardar. Revisa la conexión.'); }); }

const S = {profiles:[], foods:[], entries:[], combos:[], me:null, date:today(), tab:'hoy', cat:'todos', q:'', acat:'todos', aq:'', sheet:null, draft:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return isFinite(n) ? n : 0; };
const r1 = n => Math.round(n*10)/10;
const nf0 = new Intl.NumberFormat('es-ES',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es-ES',{maximumFractionDigits:1});
const fmt = (n,d=0) => (d ? nf1 : nf0).format(n || 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return iso(new Date()); }
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return iso(d); }
function shift(date, n){ const [y,m,d] = date.split('-').map(Number); const x = new Date(y,m-1,d+n); return iso(x); }
function dateLabel(date){
  if(date===today()) return 'Hoy'; if(date===shift(today(),-1)) return 'Ayer'; if(date===shift(today(),1)) return 'Mañana';
  const [y,m,d] = date.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('es-ES',{weekday:'short', day:'numeric', month:'short'});
}
function plural(w, n){ if(n===1 || !w) return w; if(/ón$/.test(w)) return w.slice(0,-2)+'ones'; if(/[aeiouáéíóú]$/.test(w)) return w+'s'; return w+'es'; }
const profile = (id=S.me) => S.profiles.find(p=>p.id===id);
const food = id => S.foods.find(f=>f.id===id);
const visibleFoods = () => S.foods.filter(f => !f.owner || f.owner===S.me);
const dayEntries = (date=S.date) => S.entries.filter(e=>e.profile===S.me && e.date===date).sort((a,b)=>a.ts-b.ts);
function macrosFor(f, qty){ const k = f.basis==='g' ? qty/100 : qty; return {kcal:Math.round(f.kcal*k), p:r1(f.p*k), c:r1(f.c*k), f:r1(f.f*k)}; }
function totals(list){ return list.reduce((t,e)=>({kcal:t.kcal+e.kcal, p:t.p+e.p, c:t.c+e.c, f:t.f+e.f}), {kcal:0,p:0,c:0,f:0}); }
function qtyLabel(f, qty, basis){
  basis = f ? f.basis : (basis || 'g');
  if(basis==='ud'){ const u = f?.unit_name || 'ración'; return fmt(qty,1)+' '+plural(u, qty); }
  if(f?.unit_g){ const n = qty / f.unit_g; if(Math.abs(n*2 - Math.round(n*2)) < 0.01) return fmt(n,1)+' '+plural(f.unit_name, n)+' · '+fmt(qty)+' g'; }
  return fmt(qty,1)+' g';
}
function baseLabel(f){ return f.basis==='g' ? '/100 g' : '/'+(f.unit_name||'ración'); }
function macroLine(m){ return `P ${fmt(m.p,1)} · H ${fmt(m.c,1)} · G ${fmt(m.f,1)}`; }
function usage(){ const u = {}, from = daysAgo(45); for(const e of S.entries) if(e.profile===S.me && e.food_id && e.date>=from) u[e.food_id] = (u[e.food_id]||0)+1; return u; }
function defaultQty(f){ return f.basis==='ud' ? 1 : (f.unit_g || 100); }
function quickLabel(f){ return f.basis==='ud' ? '+1' : f.unit_g ? '+1 '+f.unit_name : '+100 g'; }

function calc(c){
  const bmr = 10*c.w + 6.25*c.h - 5*c.age + (c.sex==='h' ? 5 : -161);
  const tdee = bmr * c.act;
  const kcal = Math.round(tdee*(1+c.goal)/10)*10;
  const p = Math.round(c.w*c.pk), f = Math.round(c.w*0.9);
  return {bmr, tdee, kcal, p, f, c:Math.max(0, Math.round((kcal - p*4 - f*9)/4))};
}

function updateTargetHint(){

function renderWeek(){
  const me = profile(), days = [];
  for(let i=6;i>=0;i--){ const d = shift(today(), -i); days.push({d, t:totals(dayEntries(d))}); }
  const max = Math.max(me.kcal*1.2, ...days.map(x=>x.t.kcal)) || 1;
  const logged = days.filter(x=>x.t.kcal>0);
  const avg = logged.length ? totals(logged.map(x=>x.t)) : null;
  $('#weekBox').innerHTML = `
    <div class="week">
      <div class="tl" style="bottom:${18 + me.kcal/max*100}px"></div>
      ${days.map(x=>{ const [y,m,dd] = x.d.split('-').map(Number); const wd = new Date(y,m-1,dd).toLocaleDateString('es-ES',{weekday:'narrow'});
        return `<div class="col" title="${fmt(x.t.kcal)} kcal"><div class="bw"><div class="b ${x.t.kcal>me.kcal?'over':''} ${x.t.kcal?'':'zero'}" style="height:${x.t.kcal/max*100}%"></div></div><div class="d">${wd.toUpperCase()}</div></div>`; }).join('')}
    </div>
    <p class="note" style="margin:10px 0 0">${avg ? `Media de ${logged.length} ${logged.length===1?'día':'días'} con registro: <b>${fmt(avg.kcal/logged.length)} kcal</b> y <b>${fmt(avg.p/logged.length)} g de proteína</b> (objetivo ${fmt(me.kcal)} kcal y ${fmt(me.p)} g). La línea discontinua es tu objetivo.` : 'Cuando apuntes unos días verás aquí tu media frente al objetivo.'}</p>`;
}

/* ---------- Acciones sobre el diario ---------- */
function snapshotDay(){ return dayEntries().map(e=>({...e})); }
function undoTo(before){
  const ids = new Set(before.map(e=>e.id));
  const now = dayEntries(), removed = now.filter(e=>!ids.has(e.id)).map(e=>e.id);
  S.entries = S.entries.filter(e=>!removed.includes(e.id));
  for(const b of before){ const i = S.entries.findIndex(e=>e.id===b.id); if(i>=0) S.entries[i] = b; else S.entries.push(b); }
  DB.del('entries', removed); DB.save('entries', before);
  if(S.sheet?.type==='food') foodSheet(S.sheet.id); else render();
}
function addFood(id, qty, silent){
  const f = food(id); if(!f || !(qty>0)) return;
  let e = dayEntries().find(x=>x.food_id===id);
  if(e){ e.qty = r1(e.qty + qty); Object.assign(e, macrosFor(f, e.qty)); }
  else { e = {id:uid(), profile:S.me, date:S.date, food_id:id, name:f.name, qty:r1(qty), basis:f.basis, ...macrosFor(f, qty), ts:Date.now()}; S.entries.push(e); }
  DB.save('entries', e);
  return e;
}
function act_addWithUndo(id, qty){
  const before = snapshotDay(), f = food(id);
  if(!addFood(id, qty)) return;
  toast(`Sumado ${qtyLabel(f, qty)} de ${f.name.split(' (')[0]}`, ()=>undoTo(before));
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Deshacer</button>' : ''}`;
  t.hidden = false; clearTimeout(toastTimer);
  if(undo) $('#undoBtn').onclick = () => { t.hidden = true; undo(); };
  toastTimer = setTimeout(()=>{ t.hidden = true; }, undo ? 5000 : 3000);
}
function armed(el){ if(el.classList.contains('armed')) return true; el.classList.add('armed'); el.dataset.label = el.textContent; el.textContent = 'Pulsa otra vez para confirmar'; setTimeout(()=>{ el.classList.remove('armed'); el.textContent = el.dataset.label; }, 3000); return false; }

/* ---------- Eventos ---------- */
const A = {
  tab: el => { S.tab = el.dataset.tab; render(); window.scrollTo(0,0); },
  prevDay: () => goDay(shift(S.date,-1)), nextDay: () => goDay(shift(S.date,1)), today: () => goDay(today()),
  picker: () => { S.me = null; renderPicker(); },
  choose: el => { S.me = el.dataset.id; LS.set('cm_me', S.me); S.tab = 'hoy'; render(); },
  addProfile: () => {
    const p = {id:uid(), name:'Nuevo perfil', emoji:'🙂', kcal:2000, p:120, c:220, f:65};
    S.profiles.push(p); DB.save('profiles', p);
    S.me = p.id; LS.set('cm_me', p.id); S.tab = 'perfil'; render(); toast('Perfil creado. Ponle nombre y objetivos.');
  },
  saveProfile: el => { const p = profile(el.dataset.id); p.name = $('#pn_'+p.id).value.trim() || p.name; p.emoji = $('#pe_'+p.id).value.trim() || '🙂'; DB.save('profiles', p); render(); toast('Perfil guardado'); },
  delProfile: el => { if(!armed(el)) return; const id = el.dataset.id;
    const ents = S.entries.filter(e=>e.profile===id).map(e=>e.id), cbs = S.combos.filter(c=>c.profile===id).map(c=>c.id), fds = S.foods.filter(f=>f.owner===id).map(f=>f.id);
    S.entries = S.entries.filter(e=>e.profile!==id); S.combos = S.combos.filter(c=>c.profile!==id); S.foods = S.foods.filter(f=>f.owner!==id); S.profiles = S.profiles.filter(p=>p.id!==id);
    DB.del('entries', ents); DB.del('combos', cbs); DB.del('foods', fds); DB.del('profiles', id); render(); toast('Perfil borrado'); },
  cat: el => { S.cat = el.dataset.cat; renderHoy(); },
  acat: el => { S.acat = el.dataset.cat; renderAlimentos(); },
  food: el => foodSheet(el.dataset.id),
  quick: el => { const f = food(el.dataset.id); act_addWithUndo(f.id, defaultQty(f)); renderHoy(); },
  add: el => { addFood(el.dataset.id, num(el.dataset.q)); foodSheet(el.dataset.id); toast('Sumado'); },
  addCustom: el => { const q = num($('#customQty').value); if(!(q>0)){ $('#customQty').focus(); return; } addFood(el.dataset.id, q); foodSheet(el.dataset.id); toast('Sumado'); },
  entry: el => entrySheet(el.dataset.id),
  step: el => { const i = $('#es_qty'); i.value = r1(Math.max(0, num(i.value) + num(el.dataset.s))); updateEntryPreview(); },
  saveEntry: el => { const e = S.entries.find(x=>x.id===el.dataset.id), f = food(e.food_id), q = num($('#es_qty').value);
    if(!(q>0)) return A.delEntry(el, true);
    e.qty = r1(q); Object.assign(e, macrosFor(f, e.qty)); DB.save('entries', e); closeSheet(); },
  delEntry: (el, skip) => { const before = snapshotDay(); const id = el.dataset.id; S.entries = S.entries.filter(e=>e.id!==id); DB.del('entries', id); closeSheet(); toast('Quitado del día', ()=>undoTo(before)); },
  estimate: () => estimateSheet(),
  kpreset: el => { $('#es_kcal').value = el.dataset.k; },
  saveEstimate: el => {
    const kcal = Math.round(num($('#es_kcal').value)); if(!(kcal>0)){ $('#es_kcal').focus(); return; }
    const vals = {name:$('#es_name').value.trim() || 'Estimación', kcal, p:r1(num($('#es_p').value)), c:r1(num($('#es_c').value)), f:r1(num($('#es_f').value))};
    if(el.dataset.id){ const e = S.entries.find(x=>x.id===el.dataset.id); Object.assign(e, vals); DB.save('entries', e); closeSheet(); return; }
    const before = snapshotDay();
    const e = {id:uid(), profile:S.me, date:S.date, food_id:null, qty:1, basis:'ud', ts:Date.now(), ...vals};
    S.entries.push(e); DB.save('entries', e); closeSheet(); toast(`Sumadas ${fmt(kcal)} kcal`, ()=>undoTo(before));
  },
  addCombo: el => { const c = S.combos.find(x=>x.id===el.dataset.id), before = snapshotDay();
    c.items.forEach(it=>addFood(it.food_id, it.qty)); if(S.tab!=='hoy') S.tab = 'hoy'; render(); toast(`Combo «${c.name}» sumado`, ()=>undoTo(before)); },
  newCombo: () => comboSheet(null),
  editCombo: el => comboSheet(el.dataset.id),
  saveDayCombo: () => { comboSheet(null, dayEntries().filter(e=>e.food_id && food(e.food_id)).map(e=>({food_id:e.food_id, qty:e.qty}))); },
  comboFromDay: () => { S.draft.name = $('#cb_name').value; const add = dayEntries().filter(e=>e.food_id && food(e.food_id)).map(e=>({food_id:e.food_id, qty:e.qty})); if(!add.length){ toast('No hay alimentos apuntados este día'); return; } S.draft.items.push(...add); drawCombo(); },
  rmItem: el => { S.draft.name = $('#cb_name').value; S.draft.items.splice(+el.dataset.i, 1); drawCombo(); },
  pickItem: el => { const f = food(el.dataset.id); S.draft.name = $('#cb_name').value; S.draft.items.push({food_id:f.id, qty:defaultQty(f)}); drawCombo(); },
  saveCombo: () => { const d = S.draft; d.name = $('#cb_name').value.trim(); d.items = d.items.filter(i=>i.qty>0 && food(i.food_id));
    if(!d.name){ $('#cb_name').focus(); toast('Ponle un nombre al combo'); return; } if(!d.items.length){ toast('Añade al menos un alimento'); return; }
    if(!d.id){ d.id = uid(); S.combos.push(d); } else { const i = S.combos.findIndex(c=>c.id===d.id); S.combos[i] = d; }
    const row = {id:d.id, profile:d.profile, name:d.name, items:d.items}; DB.save('combos', row); closeSheet(); toast('Combo guardado'); },
  delCombo: el => { if(!armed(el)) return; const id = S.draft.id; S.combos = S.combos.filter(c=>c.id!==id); DB.del('combos', id); closeSheet(); toast('Combo borrado'); },
  newFood: () => foodEditSheet(null),
  editFood: el => foodEditSheet(el.dataset.id),
  basis: el => { readFoodDraft(); S.draft.basis = el.dataset.v; if(el.dataset.v==='ud' && !S.draft.unit_name) S.draft.unit_name = 'ración'; drawFoodEdit(); },
  saveFood: () => { const d = readFoodDraft(); if(!d.name){ $('#fe_name').focus(); toast('Ponle un nombre'); return; }
    const row = {id:d.id || uid(), name:d.name, cat:d.cat, basis:d.basis, kcal:d.kcal, p:d.p, c:d.c, f:d.f, unit_name:d.unit_name, unit_g:d.unit_g, owner:d.owner};
    const i = S.foods.findIndex(f=>f.id===row.id); if(i>=0) S.foods[i] = row; else S.foods.push(row);
    DB.save('foods', row); closeSheet(); toast(d.id ? 'Alimento actualizado' : 'Alimento creado'); },
  delFood: el => { if(!armed(el)) return; const id = S.draft.id; S.foods = S.foods.filter(f=>f.id!==id); DB.del('foods', id); closeSheet(); toast('Alimento borrado. Lo ya apuntado se mantiene.'); },
  close: () => closeSheet(),
  saveTargets: () => { const p = profile(); p.kcal = Math.round(num($('#t_kcal').value)); p.p = Math.round(num($('#t_p').value)); p.c = Math.round(num($('#t_c').value)); p.f = Math.round(num($('#t_f').value)); DB.save('profiles', p); toast('Objetivos guardados'); },
  sex: el => { for(const b of document.querySelectorAll('#c_sex button')) b.setAttribute('aria-pressed', b===el); updateCalc(); },
  useCalc: () => { const r = calc(readCalc()); $('#t_kcal').value = r.kcal; $('#t_p').value = r.p; $('#t_c').value = r.c; $('#t_f').value = r.f; A.saveTargets(); updateTargetHint(); window.scrollTo({top:0, behavior:'smooth'}); },
  export: async () => {
    const data = JSON.stringify({app:'calculadora-fitness', version:1, profiles:S.profiles, foods:S.foods, entries:S.entries, combos:S.combos});
    const box = $('#importBox');
    try{ await navigator.clipboard.writeText(data); toast('Datos copiados. Guárdalos en una nota o pégalos en la otra versión.'); }
    catch(e){ box.value = data; box.focus(); box.select(); toast('Selecciona y copia el texto del cuadro'); }
  },
  import: () => {
    let d; try{ d = JSON.parse($('#importBox').value); }catch(e){ toast('Ese texto no es una copia válida'); return; }
    if(!d || !Array.isArray(d.foods) || !Array.isArray(d.profiles)){ toast('Ese texto no es una copia válida'); return; }
    for(const t of ['profiles','foods','entries','combos']){ const rows = d[t] || [];
      for(const r of rows){ const i = S[t].findIndex(x=>x.id===r.id); if(i>=0) S[t][i] = r; else S[t].push(r); }
      DB.save(t, rows); }
    $('#importBox').value = ''; render(); toast('Datos importados');
  }
};
function goDay(d){ S.date = d; ensureDay(d); render(); }
async function ensureDay(d){
  if(DB.adapter.name!=='supabase') return;
  try{ const rows = await DB.adapter.day(S.me, d); if(rows && rows.length){ for(const r of rows) if(!S.entries.some(e=>e.id===r.id)) S.entries.push(r); render(); } }catch(e){ console.error(e); }
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const fn = A[el.dataset.act]; if(fn){ ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.id==='q'){ S.q = el.value; renderFoodList(); }
  else if(el.id==='aq'){ S.aq = el.value; $('#alist').innerHTML = alimentosRows(filterFoods(S.aq, S.acat).sort((a,b)=>a.name.localeCompare(b.name,'es'))); }
  else if(el.id==='es_qty') updateEntryPreview();
  else if(/^t_/.test(el.id)) updateTargetHint();
  else if(/^c_/.test(el.id)) updateCalc();
  else if(/^fe_/.test(el.id)) updateFoodHint();
  else if(el.dataset.ci !== undefined){ S.draft.items[+el.dataset.ci].qty = num(el.value); }
  else if(el.id==='cb_q'){
    const res = el.value.trim() ? filterFoods(el.value, 'todos').slice(0,8) : [];
    $('#cb_res').innerHTML = res.map(f=>`<button data-act="pickItem" data-id="${f.id}"><span>${esc(f.name)}</span><span class="note">${esc(quickLabel(f))}</span></button>`).join('');
  }
});
document.addEventListener('change', ev => { if(/^c_/.test(ev.target.id)) updateCalc(); if(ev.target.dataset.ci !== undefined) drawCombo(); });
document.addEventListener('keydown', ev => {
  if(ev.key==='Escape' && !$('#sheet').hidden) closeSheet();
  if(ev.key==='Enter' && ev.target.id==='customQty') $('[data-act="addCustom"]')?.click();
});
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState!=='visible') return;
  if(S.date!==today() && S._lastToday!==today()){ S.date = today(); }
  S._lastToday = today();
  if(DB.adapter && DB.adapter.name!=='local' && !S.sheet){ try{ Object.assign(S, await DB.load()); render(); }catch(e){} } else if(!S.sheet) render();
});

/* ---------- Arranque ---------- */
(async function start(){
  try{ Object.assign(S, await DB.load()); }
  catch(e){ console.error(e); Object.assign(S, {profiles:SEED_PROFILES, foods:SEED_FOODS, combos:SEED_COMBOS, entries:[]}); setTimeout(()=>toast('No se ha podido conectar con la nube. Revisa CONFIG.'), 300); }
  S.me = LS.get('cm_me'); if(!profile() && S.profiles.length===1) S.me = S.profiles[0].id; S._lastToday = today();
  render();
  if('serviceWorker' in navigator && location.protocol==='https:' && !/claude/.test(location.hostname)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
